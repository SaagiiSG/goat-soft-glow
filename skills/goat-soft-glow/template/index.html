<!doctype html>
<html lang="mn" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.1/dist/gsap.min.js"></script>
    <script src="plan.js"></script>
    <script src="goat-lib.js"></script>
    <link rel="stylesheet" href="look.css" />
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="{{DUR}}" data-width="1080" data-height="1920">
      <div id="drift">
        <video id="clip" src="main.mp4" data-start="0" data-duration="{{DUR}}" data-media-start="0" data-track-index="0" muted playsinline></video>
      </div>
      <div id="dip" class="cream"></div>
      <div id="open" class="cream"></div>
      <div id="close" class="cream"></div>
      <div id="card" class="cream"></div>
      <div id="words"></div>
    </div>
    <script src="look.js"></script>
  </body>
</html>
